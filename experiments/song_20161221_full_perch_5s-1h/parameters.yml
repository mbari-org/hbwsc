# hbws_clustering session parameters
# ---------------------------------------------------------------------------

# Audio input — one or more WAV files
audio_files:
  # - ../../MARS_20161221_000046_32kHz.wav
  - ../../MARS_20161221_000046_32kHz_gain_50_1h.wav

## NOTE: NO SCORING USED.

# Use Perch
embedder_type: perch

# Windowing
# window_sec: 0.5
window_sec: 5.0
# hop_sec: 0.25
hop_sec: 1.0
sample_rate: 32000

# UMAP
umap_components: 2           # for visualization (2-D scatter plot)
umap_cluster_components: 20  # for HDBSCAN clustering
umap_neighbors: 15

# HDBSCAN
min_cluster_size: 100

# Hyperparameter sweep
sweep_dims: "2,5,10,15,20,30"
sweep_mcs: "50,100,200"
sweep_workers: 2

# Timeline plot segmentation (minutes per segment; omit or set to 0 for a single full plot)
# timeline_segment_minutes: 10

# Audio export (samples per cluster)
n_cluster_samples: 10

# Manual labels for comparison (Raven format; optional)
manual_labels: ../../ryjo_labels/MARS_20161221_000046_SongSession_16kHz_HPF5HzNorm_labels.txt
