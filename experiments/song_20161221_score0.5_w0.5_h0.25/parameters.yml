# hbws_clustering session parameters
# ---------------------------------------------------------------------------

# Audio input — one or more WAV files
audio_files:
  - ../../MARS_20161221_000046_SongSession_16kHz_HPF5Hz.wav

# Score-guided windowing — choose one or neither
# score_file: /path/to/scores.npy       # explicit score file (single WAV only)
# score_dir:  /path/to/scores/base/dir  # auto-locate by date from WAV filename
score_file: ../../MARS_20161221_000046_SongSession_10kHz_HPF5Hz_scores.npy
# NOTE: scores are one float per second (line 107: "one float per second, shape (86400,)").
# The 16,797 entries correspond to 16,797 seconds ≈ 4.67 hours of recording.
# The indexing is purely time-based (high_score_segments returns (start_sec, end_sec) tuples),
# so using the 16kHz WAV with the 10kHz scores file is perfectly fine.

score_threshold: 0.5

# Windowing
window_sec: 0.5
hop_sec: 0.25
sample_rate: 16000

# UMAP
umap_components: 2           # for visualization (2-D scatter plot)
umap_cluster_components: 15  # for HDBSCAN clustering
umap_neighbors: 15

# HDBSCAN
min_cluster_size: 100        # default; can be overridden on 'run' command line

# Hyperparameter sweep
sweep_dims: "2,5,10,15,20,30"
sweep_mcs: "50,100,200"
sweep_workers: 2

# Timeline plot segmentation (minutes per segment; omit or set to 0 for a single full plot)
# timeline_segment_minutes: 10

# Audio export (samples per cluster)
n_cluster_samples: 10

# Manual labels for comparison (Raven format; optional)
manual_labels: ../../ryjo_labels/MARS_20161221_000046_SongSession_16kHz_HPF5HzNorm_labels.txt
